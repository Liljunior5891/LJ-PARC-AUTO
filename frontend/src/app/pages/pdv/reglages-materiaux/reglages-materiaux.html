@if (erreur()) {
  <div class="message erreur">{{ erreur() }}</div>
}

@if (formulaire(); as f) {
  <!-- ============================================================ credit -->
  <section class="bloc-reglage" id="reglage-credit" [class.actif]="f.creditActif">
    <label class="entete-bloc">
      <span class="pictogramme" aria-hidden="true">💳</span>
      <span>
        <span class="titre-bloc">Vente a credit et acomptes</span>
        <span class="texte-bloc">Le client emporte la marchandise et paie tout ou partie plus tard. Il faut une fiche client.</span>
      </span>
      <input class="bascule" type="checkbox" name="creditActif" [(ngModel)]="f.creditActif" aria-label="Autoriser la vente a credit" />
    </label>
    <div class="corps-bloc">
        <label class="ligne-option" [style.opacity]="f.creditActif ? 1 : 0.5">
          <span><strong>Le caissier peut vendre a credit</strong>
            <small>Dans la limite du plafond du client. Desactive : gerant et administrateur seulement.</small></span>
          <input class="bascule" type="checkbox" name="creditCaissier" [disabled]="!f.creditActif" [(ngModel)]="f.creditCaissier" />
        </label>
        <label class="ligne-option" [style.opacity]="f.creditActif ? 1 : 0.5">
          <span><strong>Bloquer les clients en retard</strong>
            <small>Pas de nouveau credit tant qu'une echeance est depassee.</small></span>
          <input class="bascule" type="checkbox" name="bloquerSiRetard" [disabled]="!f.creditActif" [(ngModel)]="f.bloquerSiRetard" />
        </label>
        <label class="ligne-option" [style.opacity]="f.creditActif ? 1 : 0.5">
          <span><strong>Le gerant peut passer outre</strong>
            <small>Gerant et administrateur peuvent depasser le plafond ou servir un client en retard.</small></span>
          <input class="bascule" type="checkbox" name="depassementGerant" [disabled]="!f.creditActif" [(ngModel)]="f.depassementGerant" />
        </label>
        <div class="champs-bloc" [style.opacity]="f.creditActif ? 1 : 0.5">
          <div class="champ">
            <label for="plafond">Plafond par defaut (F)</label>
            <input id="plafond" name="plafond" type="number" min="0" step="1000" [disabled]="!f.creditActif"
                   [(ngModel)]="f.plafondDefaut" placeholder="Vide = sans limite" />
            <small>Pour les clients sans plafond propre.</small>
          </div>
          <div class="champ">
            <label for="delai">Delai de paiement (jours)</label>
            <input id="delai" name="delai" type="number" min="0" max="365" [disabled]="!f.creditActif" [(ngModel)]="f.delaiPaiementJours" />
            <small>Echeance des ventes a credit.</small>
          </div>
          <div class="champ">
            <label for="acompte">Acompte minimum (%)</label>
            <input id="acompte" name="acompte" type="number" min="0" max="100" [disabled]="!f.creditActif" [(ngModel)]="f.acompteMinimum" />
            <small>0 : vente entierement a credit possible.</small>
          </div>
        </div>
      <label class="ligne-option">
        <span><strong>Fiche client obligatoire pour toute vente</strong>
          <small>Chaque vente, meme comptant, doit etre rattachee a un client enregistre.</small></span>
        <input class="bascule" type="checkbox" name="clientObligatoire" [(ngModel)]="f.clientObligatoire" />
      </label>
    </div>
  </section>

  <!-- ============================================================= devis -->
  <section class="bloc-reglage" id="reglage-devis" [class.actif]="f.devisActif">
    <label class="entete-bloc">
      <span class="pictogramme" aria-hidden="true">📄</span>
      <span>
        <span class="titre-bloc">Devis (pro forma)</span>
        <span class="texte-bloc">Le panier de la caisse s'enregistre en devis, s'imprime en A4, puis s'encaisse a ses prix.</span>
      </span>
      <input class="bascule" type="checkbox" name="devisActif" [(ngModel)]="f.devisActif" aria-label="Etablir des devis" />
    </label>
    @if (f.devisActif) {
      <div class="corps-bloc">
        <div class="champs-bloc">
          <div class="champ">
            <label for="validite">Validite d'un devis (jours)</label>
            <input id="validite" name="validite" type="number" min="1" max="365" [(ngModel)]="f.devisValiditeJours" />
          </div>
          <div class="champ" style="grid-column: 1 / -1">
            <label for="mentions">Conditions imprimees sur les devis</label>
            <textarea id="mentions" name="mentions" rows="2" maxlength="500" [(ngModel)]="f.mentionsDevis"
                      placeholder="Ex. Prix valables dans la limite des stocks. Livraison a la charge du client."></textarea>
          </div>
        </div>
      </div>
    }
  </section>

  <!-- =========================================================== facture -->
  <section class="bloc-reglage" id="reglage-facture" [class.actif]="f.factureA4 || f.tvaActive">
    <div class="entete-bloc">
      <span class="pictogramme" aria-hidden="true">🧾</span>
      <span>
        <span class="titre-bloc">Facture et TVA</span>
        <span class="texte-bloc">Document remis au client apres la vente.</span>
      </span>
      <span></span>
    </div>
    <div class="corps-bloc">
      <label class="ligne-option">
        <span><strong>Facture A4</strong>
          <small>Proposee apres chaque vente et depuis l'historique, avec les coordonnees et le NIF du client.</small></span>
        <input class="bascule" type="checkbox" name="factureA4" [(ngModel)]="f.factureA4" />
      </label>
      <label class="ligne-option">
        <span><strong>Detailler la TVA</strong>
          <small>Prix TTC : la facture en extrait le HT et la TVA au taux de la societe. Desactive : « TVA non applicable ».</small></span>
        <input class="bascule" type="checkbox" name="tvaActive" [(ngModel)]="f.tvaActive" />
      </label>
    </div>
  </section>

  <!-- ================================================== conditionnements -->
  <section class="bloc-reglage" id="reglage-conditionnements" [class.actif]="f.conditionnementsActifs">
    <label class="entete-bloc">
      <span class="pictogramme" aria-hidden="true">📦</span>
      <span>
        <span class="titre-bloc">Conditionnements</span>
        <span class="texte-bloc">Ciment au sac ou a la tonne, fer a la barre ou a la botte, carreaux au m² ou au carton. Le stock reste compte dans l'unite de base.</span>
      </span>
      <input class="bascule" type="checkbox" name="conditionnements" [(ngModel)]="f.conditionnementsActifs" aria-label="Vendre sous plusieurs unites" />
    </label>
  </section>

  <!-- ======================================================== livraison -->
  <section class="bloc-reglage" id="reglage-livraison" [class.actif]="f.livraisonDifferee">
    <label class="entete-bloc">
      <span class="pictogramme" aria-hidden="true">🚚</span>
      <span>
        <span class="titre-bloc">Livraison en plusieurs fois</span>
        <span class="texte-bloc">Le client emporte une partie et revient chercher le reste ; chaque remise produit un bon de livraison a signer.</span>
      </span>
      <input class="bascule" type="checkbox" name="livraisonDifferee" [(ngModel)]="f.livraisonDifferee" aria-label="Livraison en plusieurs fois" />
    </label>
    @if (f.livraisonDifferee) {
      <div class="corps-bloc">
        <label class="ligne-option">
          <span><strong>Vendre plus que le stock disponible</strong>
            <small>Le surplus reste a livrer a l'arrivage, pour un client a fiche. Le disponible peut devenir negatif.</small></span>
          <input class="bascule" type="checkbox" name="venteSurArrivage" [(ngModel)]="f.venteSurArrivage" />
        </label>
      </div>
    }
  </section>
}
