  <!-- Douchette -->
  <g transform="translate(70 330) rotate(-18)">
    <path d="M0 0h96a14 14 0 0 1 14 14v20a14 14 0 0 1-14 14H48l-14 70H8l8-70H0z" fill="#fff" fill-opacity=".1"/>
