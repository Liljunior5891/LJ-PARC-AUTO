<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ecran de caisse tactile -->
  <g opacity=".95">
    <rect x="170" y="110" width="400" height="270" rx="22" fill="#fff" fill-opacity=".07"/>
    <rect x="192" y="132" width="250" height="226" rx="10" fill="#fff" fill-opacity=".05"/>
    <!-- grille des produits -->
    <g fill="#fff" fill-opacity=".14">
      <rect x="208" y="148" width="66" height="56" rx="8"/>
      <rect x="284" y="148" width="66" height="56" rx="8"/>
      <rect x="360" y="148" width="66" height="56" rx="8"/>
      <rect x="208" y="214" width="66" height="56" rx="8"/>
      <rect x="284" y="214" width="66" height="56" rx="8" fill="#6ee7b7" fill-opacity=".55"/>
      <rect x="360" y="214" width="66" height="56" rx="8"/>
      <rect x="208" y="280" width="66" height="56" rx="8"/>
      <rect x="284" y="280" width="66" height="56" rx="8"/>
      <rect x="360" y="280" width="66" height="56" rx="8"/>
    </g>
    <!-- panier -->
    <path d="M458 148h96M458 176h80M458 204h88M458 232h70" stroke-opacity=".7"/>
    <path d="M458 290h96" stroke-opacity=".45"/>
    <rect x="458" y="306" width="96" height="36" rx="10" fill="#6ee7b7" fill-opacity=".6" stroke="none"/>
    <!-- pied -->
