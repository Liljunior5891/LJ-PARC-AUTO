# Nova en HTTPS : front Angular servi depuis le volume, /api renvoye a l'API (conteneur nova-api, 127.0.0.1:8087).
<VirtualHost *:443>
    ServerName nova.ljtechnologie.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/nova.ljtechnologie.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nova.ljtechnologie.com/privkey.pem

    DocumentRoot /mnt/HC_Volume_107456986/nova/front
    <Directory /mnt/HC_Volume_107456986/nova/front>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Application a page unique : toute adresse inconnue charge index.html.
        FallbackResource /index.html
    </Directory>

    # Justificatifs et import ZIP : l'API fixe ses propres plafonds.
    LimitRequestBody 73400320

    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api http://127.0.0.1:8087/api
    ProxyPassReverse /api http://127.0.0.1:8087/api

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

    # index.html et le service worker toujours frais ; les fichiers hashes en cache long.
    <LocationMatch "^/(index\.html|sw\.js|manifest\.webmanifest)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "\.(js|css|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/nova-error.log
    CustomLog ${APACHE_LOG_DIR}/nova-access.log combined
</VirtualHost>
