# Nova (nova.ljtechnologie.com) - port 80 : validation des certificats, puis redirection vers HTTPS.
<VirtualHost *:80>
    ServerName nova.ljtechnologie.com
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    ErrorLog  ${APACHE_LOG_DIR}/nova-error.log
    CustomLog ${APACHE_LOG_DIR}/nova-access.log combined
</VirtualHost>
