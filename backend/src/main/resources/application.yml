spring:
  application:
    name: parcauto-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parcauto}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 60 Mo pour l'archive ZIP des produits et de leurs photos ; chaque ecran garde son propre plafond.
      max-file-size: 60MB
      max-request-size: 65MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

parcauto:
  # Paiement mobile money de la Marketplace. Vide : pas de paiement en ligne,
  # seules les commandes payees au retrait / a la livraison sont proposees.
  # « simulation » : paiement de demonstration (developpement uniquement).
  paiement:
    fournisseur: ${PAIEMENT_FOURNISSEUR:}
  security:
    jwt:
      # A remplacer imperativement en production (variable d'environnement JWT_SECRET)
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLXBhcmNhdXRvLWRldi1zZWNyZXQta2V5LTMyLWJ5dGVzLW1pbmltdW0=}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  storage:
    documents-dir: ${DOCUMENTS_DIR:./data/documents}
  plateforme:
    # Compte de l'exploitant, cree au premier demarrage. A changer imperativement en production.
    admin:
      email: ${PLATEFORME_ADMIN_EMAIL:superadmin@plateforme.local}
      password: ${PLATEFORME_ADMIN_PASSWORD:Plateforme@2026}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    tg.parcauto: DEBUG
