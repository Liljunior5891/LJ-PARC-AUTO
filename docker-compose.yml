services:
  postgres:
    image: postgres:16-alpine
    container_name: parcauto-postgres
    environment:
      POSTGRES_DB: parcauto
      POSTGRES_USER: parcauto
      # Mot de passe tire du fichier .env (non versionne) : obligatoire.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
    ports:
      # Base joignable depuis ce poste uniquement, jamais depuis le reseau.
      - "127.0.0.1:5433:5432"
    volumes:
      - parcauto-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcauto -d parcauto"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  parcauto-data:
